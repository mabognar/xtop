[package]
name = "xtop"
version = "0.4.1"
edition = "2021"
license = "MIT"
keywords = ["system", "monitor", "information"]
categories = ["command-line-utilities"]
description = "Terminal system monitor. Informative and easy to use."
readme = true
documentation = "https://docs.rs/xtop"
repository = "https://github.com/mabognar/xtop"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
sysinfo = "0.40.3"
netdev = "0.47.0"
rust-embed = "8.14"
dirs = "7.0" # for finding the home directory
syntect = "5.2.0"
ureq = { version = "3.5.2", features = ["json"] }
serde_json = "1.0"
webbrowser = "1.2.7"

[package.metadata.deb]
maintainer = "Matt Bognar <mattbognar@gmail.com>"
copyright = "2026, Matthew Bognar"
license-file = ["LICENSE", "4"]
depends = "$auto"
extended-description = """
Terminal system monitor. Informative and easy to use.
"""
section = "utility"
priority = "optional"
